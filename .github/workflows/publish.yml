name: Verify release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packagist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Verify immutable release version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(php -r 'require "src/Version.php"; echo Paymos\Version::VERSION;')"
          test "$actual" = "$expected"
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      # Packagist consumes this verified Git tag through its GitHub App/webhook.
